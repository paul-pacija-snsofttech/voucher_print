        color: white;
        border: none;
        border-radius: 8px;

        <label>Amount (PHP)</label>
        <input type="text" name="tickets[4][amount]" value="1999.00" />
      </fieldset>

      <button type="submit">🖨️ Print Both Tickets</button>
    </form>

    <script>
      const form = document.getElementById("ticketForm");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const formData = new FormData(form);

        // Convert FormData into structured tickets array
        const tickets = [];
        for (const [key, value] of formData.entries()) {
          const match = key.match(/tickets\[(\d+)\]\[(.+)\]/);
          if (match) {
            const index = parseInt(match[1], 10);
            const field = match[2];
            if (!tickets[index]) tickets[index] = {};
            tickets[index][field] = value;
          }
        }

        const res = await fetch("/print", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tickets }),
        });

        const result = await res.json();
        alert(result.message);
      });
    </script>
